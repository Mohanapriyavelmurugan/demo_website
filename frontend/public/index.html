<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#1f5c55" />
        <meta name="description" content="Valtraq Healthcare delivers clinical intelligence as a service. Valtraq CDSS provides guideline-grounded decision support for outpatient physicians in India." />
        <link rel="canonical" href="https://www.valtraq.in/" />
        <meta property="og:site_name" content="Valtraq Healthcare" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://www.valtraq.in/" />
        <meta property="og:title" content="Valtraq Healthcare | Clinical Intelligence as a Service" />
        <meta property="og:description" content="Valtraq Healthcare delivers clinical intelligence as a service. Valtraq CDSS provides guideline-grounded decision support for outpatient physicians in India." />
        <meta name="twitter:card" content="summary_large_image" />
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Valtraq Healthcare",
          "alternateName": "Valtraq",
          "url": "https://www.valtraq.in/",
          "description": "Valtraq Healthcare is an Indian clinical intelligence company delivering clinical decision support as a service. Its platform, Valtraq CDSS, provides guideline-grounded decision support to outpatient physicians.",
          "email": "contact@valtraq.in",
          "address": { "@type": "PostalAddress", "addressLocality": "Kannur", "addressRegion": "Kerala", "addressCountry": "IN" },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "sales",
            "email": "contact@valtraq.in",
            "areaServed": "IN",
            "availableLanguage": ["en"]
          },
          "makesOffer": {
            "@type": "Offer",
            "itemOffered": {
              "@type": "SoftwareApplication",
              "name": "Valtraq CDSS",
              "applicationCategory": "HealthApplication",
              "description": "A clinical decision support system for outpatient care. Surfaces guideline-grounded considerations, safety flags, and structured documentation during a consultation. Every output requires physician review.",
              "operatingSystem": "Web"
            }
          }
        }
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>Valtraq Healthcare | Clinical Intelligence as a Service</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
